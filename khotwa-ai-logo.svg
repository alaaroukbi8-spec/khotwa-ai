    <path d="M115 175c-28-18-45-52-43-88 3-57 42-98 96-98 44 0 76 29 82 72 3 25-2 46-18 64l-4 29-42 17-8 37"/>
    <path d="M78 64l-38-22M82 100l-50 0M99 143l-49 28M204 44l42-24M225 94l50 0M209 142l43 26" opacity=".65"/>
    <circle cx="153" cy="72" r="35" stroke="#a94cff" opacity=".8"/>
    <circle cx="153" cy="72" r="12" fill="#24d8ff" stroke="none"/>
    <path d="M134 118q18 13 37 0M170 180l22 24 30-4" opacity=".7"/>
    <circle cx="38" cy="42" r="7" fill="#20dfff" stroke="none"/><circle cx="32" cy="100" r="7" fill="#20dfff" stroke="none"/><circle cx="50" cy="171" r="7" fill="#20dfff" stroke="none"/>
  </g>
  <!-- Moroccan architectural silhouette -->
  <g transform="translate(1260 255)" fill="#c78a44" opacity=".72">
    <path d="M86 290V92l32-48 31 48v198z"/><path d="M74 92h89l-45-65z"/><path d="M97 120h18v30H97zM124 120h18v30h-18zM97 175h18v30H97zM124 175h18v30h-18z"/>
    <path d="M0 290h260v22H0zM32 258l20-50 20 50M170 258l20-50 20 50" fill="#8c5529"/>
  </g>
  <path d="M1300 180l60-35 60 35v60h-120z" fill="none" stroke="#ffc85c" stroke-width="3" opacity=".65"/>
  <path d="M1430 310v-90" stroke="#f8e2a0" stroke-width="4"/><path d="M1430 220l72 18-72 28z" fill="#c92336" stroke="#e7d7a4" stroke-width="2"/>
  <!-- Brand wordmark -->
  <text x="800" y="585" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="142" font-weight="900" letter-spacing="5" fill="url(#silver)" stroke="#263d75" stroke-width="2" paint-order="stroke" filter="url(#shine)">KHOTWA <tspan fill="url(#gold)">AI</tspan></text>
  <path d="M250 615Q800 700 1350 615" fill="none" stroke="url(#neon)" stroke-width="9" stroke-linecap="round" filter="url(#shine)"/>
  <text x="800" y="690" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="39" font-style="italic" fill="#f7f8ff" letter-spacing="1">Plus qu’une IA… un véritable guide</text>
  <!-- Open book -->
  <g transform="translate(800 760)" filter="url(#shine)">
    <path d="M0 42Q-92 -8 -205 12L-180 70Q-82 48 0 88Q82 48 180 70L205 12Q92 -8 0 42Z" fill="#eaf3ff" stroke="url(#gold)" stroke-width="4"/>
    <path d="M0 42V88M-170 25q82-8 150 28M170 25q-82-8-150 28" fill="none" stroke="#4c88d5" stroke-width="4"/>
    <path d="M0 8v36" stroke="#ffe6a0" stroke-width="6"/>
  </g>
  <!-- Pillars -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g transform="translate(250 800)"><rect x="-155" y="-40" width="310" height="82" rx="22" fill="#071b4d" stroke="#11cfff" stroke-width="3"/><text y="-4" font-size="24" fill="#21d7ff" font-weight="bold">SOLIDARITÉ</text><text y="25" font-size="21" fill="#fff">Associations</text></g>
    <g transform="translate(615 800)"><rect x="-155" y="-40" width="310" height="82" rx="22" fill="#071b4d" stroke="#bd55ff" stroke-width="3"/><text y="-4" font-size="24" fill="#d58bff" font-weight="bold">FORMATION</text><text y="25" font-size="21" fill="#fff">Opportunités</text></g>
    <g transform="translate(985 800)"><rect x="-155" y="-40" width="310" height="82" rx="22" fill="#071b4d" stroke="#ffb74a" stroke-width="3"/><text y="-4" font-size="24" fill="#ffc66b" font-weight="bold">SERVICES</text><text y="25" font-size="21" fill="#fff">Administratifs</text></g>
    <g transform="translate(1350 800)"><rect x="-155" y="-40" width="310" height="82" rx="22" fill="#071b4d" stroke="#11cfff" stroke-width="3"/><text y="-4" font-size="24" fill="#21d7ff" font-weight="bold">ACCESSIBILITÉ</text><text y="25" font-size="21" fill="#fff">Inclusion</text></g>
  </g>
