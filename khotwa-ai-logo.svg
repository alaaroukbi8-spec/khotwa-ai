<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">KHOTWA AI — Plus qu’une IA, un véritable guide</title>
  <desc id="desc">Identité visuelle futuriste de KHOTWA AI, inspirée du Maroc, du savoir et de l’intelligence artificielle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#02091f"/><stop offset=".52" stop-color="#071b50"/><stop offset="1" stop-color="#090b2b"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff2b2"/><stop offset=".34" stop-color="#ffbd42"/><stop offset=".68" stop-color="#d87916"/><stop offset="1" stop-color="#fff0a0"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset=".55" stop-color="#dce8ff"/><stop offset="1" stop-color="#8fa8d8"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00eaff"/><stop offset=".5" stop-color="#2875ff"/><stop offset="1" stop-color="#d34cff"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#2e75ff" stop-opacity=".5"/><stop offset="1" stop-color="#06133a" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shine" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse"><path d="M54 0H0V54" fill="none" stroke="#2b8bff" stroke-opacity=".16" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <rect x="18" y="18" width="1564" height="864" rx="34" fill="url(#grid)" stroke="#297bff" stroke-opacity=".35" stroke-width="2"/>
  <ellipse cx="800" cy="400" rx="620" ry="390" fill="url(#glow)"/>
  <path d="M45 205H205l44 44h125M45 264H168l40 40h100M1555 205h-170l-48 48h-120M1550 270h-120l-42 42h-130" fill="none" stroke="#00bfff" stroke-opacity=".45" stroke-width="4"/>
  <g fill="#1ad7ff" filter="url(#shine)"><circle cx="45" cy="205" r="6"/><circle cx="420" cy="249" r="5"/><circle cx="1555" cy="205" r="6"/><circle cx="1258" cy="312" r="5"/></g>
  <!-- Digital knowledge globe -->
  <circle cx="800" cy="260" r="190" fill="#071c4b" stroke="url(#neon)" stroke-width="5" opacity=".95"/>
  <circle cx="800" cy="260" r="166" fill="none" stroke="#49c8ff" stroke-opacity=".5" stroke-width="2"/>
  <ellipse cx="800" cy="260" rx="78" ry="166" fill="none" stroke="#44c8ff" stroke-opacity=".48" stroke-width="2"/>
  <ellipse cx="800" cy="260" rx="145" ry="65" fill="none" stroke="#44c8ff" stroke-opacity=".45" stroke-width="2"/>
  <path d="M641 260H959M660 190H940M660 330H940" stroke="#44c8ff" stroke-opacity=".35" stroke-width="2" fill="none"/>
  <path d="M690 161l28-29 33 8 18 34-20 22-36-7zM821 121l31 18 8 39-30 17-24-23zM872 248l48 13 18 32-29 29-42-8-16-35zM742 300l31 11 17 41-26 26-40-20-8-32z" fill="#1f83de" opacity=".5"/>
  <path d="M594 278C655 46 945 34 1040 235" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round" filter="url(#shine)"/>
  <path d="M575 303C706 448 986 447 1065 280" fill="none" stroke="url(#neon)" stroke-width="7" stroke-linecap="round" filter="url(#shine)"/>
  <!-- Arabic signature -->
  <text x="800" y="305" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="126" font-weight="bold" fill="url(#gold)" stroke="#5d2f0b" stroke-width="2" paint-order="stroke" filter="url(#shine)">خطوة</text>
  <path d="M570 365Q800 420 1030 365" fill="none" stroke="url(#gold)" stroke-width="4" opacity=".9"/>
  <!-- AI profile on the left -->
